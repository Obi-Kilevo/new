spring.application.name=pandaNow
server.port=${PORT:4000}

# Database configuration - Use environment variables ONLY
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:postgres}  # Optional default
spring.datasource.password=${DATABASE_PASSWORD:3000}      # Optional default
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false  # Set to false in production
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# Other
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.session.store-type=none


