<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Africa Map with Lion</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        .africa-map {
            height: 90vh;        /* LARGE */
            width: auto;         /* full image visible */
            object-fit: contain; /* no cutting */
            margin-top: 40px;    /* move down */
        }
    </style>
</head>

<body>
<img src="/obi/africa.png" class="africa-map" alt="Africa Map with Lion">
</body>
</html>
